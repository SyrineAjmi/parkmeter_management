name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: |
          dotnet publish parkmeter_management.Api/parkmeter_management.Api.csproj \
            -c Release -o ./publish \
            /p:TreatWarningsAsErrors=false

      - name: Stop service before copy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            net stop ParkMeterAPI 2>nul || echo "Service not running"

      - name: Copy files to Azure VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          source: "./publish/*"
          target: "C:/parkmeter/api"

      - name: Create production config and start service
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            powershell -Command "Set-Content -Path 'C:\parkmeter\api\publish\appsettings.Production.json' -Value '{\"ConnectionStrings\":{\"DefaultConnection\":\"Server=localhost\\\\SQLEXPRESS01;Database=parkmeter_db;Trusted_Connection=True;TrustServerCertificate=True;\"}}'"
            net start ParkMeterAPI